name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Test Task 10 API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: task-10-mlops-pipeline
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run API tests
        working-directory: task-10-mlops-pipeline
        run: pytest tests/