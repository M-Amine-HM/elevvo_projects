services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: task10_api
    ports:
      - "8000:8000"
    networks:
      - mlops-net
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 8s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: task10_frontend
    ports:
      - "7860:7860"
    environment:
      # Compose service name, NOT localhost — the containers share this network.
      - API_BASE_URL=http://api:8000
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=7860
    depends_on:
      api:
        # Won't start hitting the API until it reports healthy via GET /health.
        condition: service_healthy
    networks:
      - mlops-net

networks:
  mlops-net:
    driver: bridge